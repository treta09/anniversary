<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anniversary — Interactive Card</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="logo">Anniversary</h1>
      <nav class="nav">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#gallery">Gallery</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="stage">
        <div class="card" id="step1">
          <h2>Happy 6th Anniversary, my love</h2>
          <p class="lead">Every moment with you is a treasure. Click Next to continue.</p>
          <p><button class="btn" id="nextBtn" type="button">Next</button></p>
        </div>

        <div class="card" id="step2" aria-hidden="true" style="display:none">
          <h2>Do you love me?</h2>
          <div class="options">
            <button class="opt yes" id="yesBtn" type="button">Yes</button>
            <button class="opt no" id="noBtn" type="button">No</button>
          </div>
        </div>

        <div class="card" id="result" aria-hidden="true" style="display:none">
          <h2 id="resultMsg"></h2>
          <div class="hearts" id="hearts" aria-hidden="true"></div>
          <p>
            <button class="btn download" id="downloadBtn" type="button" style="margin-top:0.5rem;margin-right:.5rem;">Download card</button>
            <button class="btn" id="againBtn" type="button" style="margin-top:0.5rem;">Again</button>
          </p>
        </div>
      </div>
    </div>
  </main>

  <script>
    (function () {
      const heartSymbol = '\u2764';
      let audioCtx = null;

      function ensureAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      function playTone(freq, type = 'sine', duration = 0.12, when = 0, volume = 0.08) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + when);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime + when);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + when);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + when + duration);
        osc.stop(audioCtx.currentTime + when + duration + 0.02);
      }

      function playPop() {
        ensureAudio();
        playTone(880, 'square', 0.06, 0, 0.06);
      }

      function playTease() {
        ensureAudio();
        playTone(660, 'sine', 0.08, 0, 0.07);
        playTone(520, 'sine', 0.12, 0.09, 0.055);
      }

      function playMelody() {
        ensureAudio();
        const notes = [520, 660, 780, 880];
        notes.forEach((note, index) => playTone(note, 'sine', 0.18, index * 0.18, 0.08));
      }

      function playChime() {
        ensureAudio();
        playTone(1200, 'sine', 0.5, 0, 0.05);
        playTone(900, 'sine', 0.6, 0.08, 0.04);
      }

      function show(element) {
        element.style.display = '';
        element.setAttribute('aria-hidden', 'false');
      }

      function hide(element) {
        element.style.display = 'none';
        element.setAttribute('aria-hidden', 'true');
      }

      function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        for (let n = 0; n < words.length; n += 1) {
          const testLine = `${line}${words[n]} `;
          const metrics = ctx.measureText(testLine);
          const testWidth = metrics.width;
          if (testWidth > maxWidth && n > 0) {
            ctx.fillText(line, x, y);
            line = `${words[n]} `;
            y += lineHeight;
          } else {
            line = testLine;
          }
        }
        ctx.fillText(line, x, y);
      }

      const nextBtn = document.getElementById('nextBtn');
      const step1 = document.getElementById('step1');
      const step2 = document.getElementById('step2');
      const result = document.getElementById('result');
      const yesBtn = document.getElementById('yesBtn');
      const noBtn = document.getElementById('noBtn');
      const resultMsg = document.getElementById('resultMsg');
      const hearts = document.getElementById('hearts');
      const againBtn = document.getElementById('againBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      let scale = 1.0;

      function generateCardImage() {
        const width = 1200;
        const height = 630;
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, '#fff5f8');
        gradient.addColorStop(1, '#ffffff');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = '#25303b';
        ctx.font = '48px system-ui, Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Happy 6th Anniversary, my love', width / 2, 120);
        ctx.fillStyle = '#6b7785';
        ctx.font = '28px system-ui, Arial';
        wrapText(ctx, `I love you soooo much, my ${heartSymbol} ${heartSymbol} ${heartSymbol}`, width / 2, 200, 920, 36);
        for (let i = 0; i < 14; i += 1) {
          const x = 80 + Math.random() * (width - 160);
          const y = 260 + Math.random() * 290;
          ctx.fillStyle = '#ff3366';
          ctx.font = `${18 + Math.random() * 36}px serif`;
          ctx.fillText(heartSymbol, x, y);
        }
        return canvas.toDataURL('image/png');
      }

      nextBtn.addEventListener('click', () => {
        ensureAudio();
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        playPop();
        hide(step1);
        show(step2);
        yesBtn.focus();
      });

      noBtn.addEventListener('click', () => {
        scale = Math.min(scale * 1.25, 6);
        yesBtn.style.transform = `scale(${scale})`;
        yesBtn.style.transition = 'transform 300ms cubic-bezier(.2,.9,.2,1)';
        noBtn.classList.remove('wiggle');
        void noBtn.offsetWidth;
        noBtn.classList.add('wiggle');
        ensureAudio();
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        playTease();
        yesBtn.classList.add('pulse');
        window.setTimeout(() => yesBtn.classList.remove('pulse'), 450);
        yesBtn.focus();
      });

      yesBtn.addEventListener('click', () => {
        ensureAudio();
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        playMelody();
        window.setTimeout(playChime, 520);
        hide(step2);
        resultMsg.innerHTML = `I love you soooo much, my bubu <span class="heart">${heartSymbol}${heartSymbol}${heartSymbol}</span>`;
        hearts.innerHTML = '';
        for (let i = 0; i < 18; i += 1) {
          const span = document.createElement('span');
          span.className = 'floating-heart';
          span.textContent = heartSymbol;
          span.style.left = `${10 + Math.random() * 80}%`;
          span.style.animationDelay = `${Math.random() * 1.5}s`;
          span.style.fontSize = `${12 + Math.random() * 36}px`;
          hearts.appendChild(span);
        }
        show(result);
        againBtn.focus();
      });

      downloadBtn.addEventListener('click', () => {
        const dataUrl = generateCardImage();
        const anchor = document.createElement('a');
        anchor.href = dataUrl;
        anchor.download = 'anniversary-card.png';
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        ensureAudio();
        playPop();
      });

      againBtn.addEventListener('click', () => {
        hide(result);
        scale = 1.0;
        yesBtn.style.transform = '';
        show(step1);
        nextBtn.focus();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          const active = document.activeElement;
          if (active && active.tagName === 'BUTTON') {
            active.click();
          }
        }
      });
    })();
  </script>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Anniversary • Built with HTML &amp; CSS</p>
    </div>
  </footer>
</body>
</html>
